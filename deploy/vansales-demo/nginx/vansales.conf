# vansales.prolabtech.net - van-sales demo (docker on 127.0.0.1:8188). HTTP only until enable-ssl.sh runs.
upstream vansales_odoo { server 127.0.0.1:8188; }

server {
    listen 80;
    listen [::]:80;
    server_name vansales.prolabtech.net;

    location / {
        proxy_pass http://vansales_odoo;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
