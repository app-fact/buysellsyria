# vansales.prolabtech.net - van-sales demo (docker on 127.0.0.1:8188, threaded: websocket on the same port)
# :443 is SNI-routed by the stream{} block in nginx.conf (default -> 127.0.0.1:8444).
upstream vansales_odoo { server 127.0.0.1:8188; }

server {
    server_name vansales.prolabtech.net;

    client_max_body_size 50m;
    proxy_read_timeout 720s;
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /websocket {
        proxy_pass http://vansales_odoo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://vansales_odoo;
        proxy_redirect off;
    }

    gzip on;
    gzip_types text/css text/plain application/json application/javascript text/xml;

    listen 127.0.0.1:8444 ssl http2; # fed by the stream SNI router on :443
    ssl_certificate /etc/letsencrypt/live/vansales.prolabtech.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vansales.prolabtech.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name vansales.prolabtech.net;
    return 301 https://$host$request_uri;
}
